<style>

:root[data-theme="dark"]{--bg:#0E171F;--surface:#15212B;--soft:#1B2833;--line:#2C3C49;--mut:#A7B4BE;--ink:#EEF4F7;--text:#D7E0E6;--hl:rgba(241,90,34,.2);--shadow:rgba(0,0,0,.5);--barmut:#5A6974;--on-bg:#EEF4F7;--on-fg:#0E171F;--halo:#0E171F;--acc-txt:#FF8A5C;--acc-bg:#C4471A;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:Montserrat,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
button,input{font-family:inherit}
#wrap{display:flex;height:100vh;width:100vw}
#side{width:380px;flex:none;background:var(--bg);border-right:1px solid var(--line);overflow-y:auto}
#map{flex:1;background:var(--soft);position:relative}
.mast{background:var(--acc-bg);color:#fff;padding:14px 20px}
.mast b{display:block;font-size:15px;font-weight:800;line-height:1.2}
.mast span{font-size:11px;font-weight:600;letter-spacing:.3px}
.body{padding:18px 20px 24px}
#headline{font-weight:800;font-size:22px;line-height:1.22;color:var(--ink);letter-spacing:-.2px}
#headline em{font-style:normal;color:var(--acc-txt)}

#subline{color:var(--mut);font-size:13px;line-height:1.45;margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:3px;border:0;background:var(--acc-bg);color:#fff;font-weight:700;font-size:12px;cursor:pointer}
.pill.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.pill:hover{filter:brightness(.95)}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink);font-weight:800;margin:22px 0 10px;padding-left:9px;border-left:3px solid var(--laranja);line-height:1.2}
.kpi{margin-top:16px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.kpi .n{font-size:38px;font-weight:800;line-height:1;color:var(--ink);letter-spacing:-.5px}
.kpi .n small{font-size:13px;color:var(--mut);font-weight:600;margin-left:5px;letter-spacing:0}
.kpi .l{font-size:12px;color:var(--mut);margin-top:6px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:3px;letter-spacing:.3px}
.tag.psb{background:#E8A317;color:#1D1D1D}.tag.ok{background:#0B7A5F;color:#fff}
.stack{display:flex;height:14px;border-radius:3px;overflow:hidden;margin-top:14px;gap:2px}
.stack span{display:block;height:100%;cursor:pointer;transition:opacity .15s}
.stack:hover span{opacity:.55}.stack span:hover{opacity:1}
.stackl{font-size:10px;color:var(--mut);margin-top:6px;line-height:1.6}
.stackl i{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 4px 0 8px;vertical-align:-1px}
.stackl i:first-child{margin-left:0}
.toggle{display:flex;gap:4px;margin-top:14px;padding:4px;background:var(--soft);border-radius:6px}
.toggle button{flex:1;padding:8px;border:0;background:transparent;color:var(--mut);border-radius:4px;font-weight:700;cursor:pointer;font-size:13px}
.toggle button.on{background:var(--on-bg);color:var(--on-fg)}
.busca{position:relative;margin-top:14px}
.busca input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);border-radius:6px;font-size:13px;color:var(--text);background:var(--surface)}
.busca input:focus{outline:2px solid var(--laranja);border-color:transparent}
.busca:before{content:"⌕";position:absolute;left:12px;top:7px;font-size:17px;color:var(--mut)}
ul{list-style:none}
.bl li{display:flex;align-items:center;gap:8px;padding:6px;font-size:12px;border-radius:4px;cursor:pointer}
.bl li:hover,.bl li.sel{background:var(--hl)}
.bl .bn{width:130px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl .bar{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bl .bar i{display:block;height:100%;border-radius:4px;background:var(--laranja)}
.bl .bv{width:52px;text-align:right;font-weight:700;color:var(--ink)}
.bl .bp{width:44px;text-align:right;color:var(--mut);font-size:11px}
.bl li:hover .bp,.bl li.sel .bp{color:var(--text)}
.foot{color:var(--mut);font-size:10px;margin-top:22px;line-height:1.55;padding-top:12px;border-top:1px solid var(--line)}
.author{position:absolute;top:14px;right:14px;z-index:1000;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 13px;font-size:12px;box-shadow:0 4px 14px var(--shadow)}
.author b{color:var(--acc-txt);font-weight:800}
.author span{color:var(--mut);font-size:10px;display:block;letter-spacing:.4px;text-transform:uppercase;margin-top:1px}
#overlay{position:absolute;top:14px;left:14px;z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:310px;pointer-events:none}
#overlay>*{pointer-events:auto}
#back{box-shadow:0 4px 14px var(--shadow)}
#card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--laranja);border-radius:8px;padding:12px 14px;min-width:250px;box-shadow:0 8px 24px var(--shadow);position:relative}
#card.hov{pointer-events:none}
#card .k{font-weight:800;font-size:14px;color:var(--ink);padding-right:18px}
#card .k small{display:block;font-size:11px;font-weight:600;color:var(--mut);margin-top:1px}
#card .big{font-size:26px;font-weight:800;color:var(--ink);margin-top:4px}
#card .big small{font-size:12px;color:var(--mut);font-weight:600}
#card .s{color:var(--mut);font-size:12px;margin-top:2px}
#card .row{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-top:6px}
#card .row b{color:var(--ink)}
#card .sep{margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
#card .hint{margin-top:8px;font-size:11px;color:var(--acc-txt);font-weight:700}
#card .x{position:absolute;top:8px;right:10px;border:0;background:none;font-size:18px;color:var(--mut);cursor:pointer;line-height:1}
#card .badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:3px;background:var(--acc-bg);color:#fff;margin-left:6px;vertical-align:2px}
.lw{width:0;height:0}
.lab{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;text-align:center;pointer-events:none;font-size:11px;font-weight:700;color:var(--ink);text-shadow:0 0 3px var(--halo),0 0 3px var(--halo),0 0 3px var(--halo)}
.lab b{display:block;font-size:12px;color:var(--text)}
.lab.fz{pointer-events:auto;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 9px;text-shadow:none;box-shadow:0 3px 10px var(--shadow)}
.lab.fz b{color:var(--acc-txt)}
.lab.fz:hover{border-color:var(--laranja)}
.lab.fz small{display:block;font-size:9px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.legend{background:var(--surface);border:1px solid var(--line);padding:10px 12px;border-radius:8px;color:var(--text);font-size:11px;line-height:1.8;box-shadow:0 4px 14px var(--shadow)}
.legend .t{font-weight:800;color:var(--ink);margin-bottom:2px}
.legend .grad{width:170px;height:12px;border-radius:6px;margin:6px 0 3px;border:1px solid var(--line)}
.legend .gl{display:flex;justify-content:space-between;color:var(--mut);line-height:1.5}
.legend i{display:inline-block;width:14px;height:14px;margin-right:6px;border-radius:3px;vertical-align:-3px}
.leaflet-container{font-family:inherit;background:var(--soft)}
.leaflet-bar a{color:var(--ink);background:var(--surface);border-color:var(--line)}.leaflet-bar a:hover{background:var(--soft)}.leaflet-bar{border-color:var(--line)!important}
@media(max-width:760px){#wrap{flex-direction:column-reverse}#side{width:100%;height:55vh;border-right:0;border-top:1px solid var(--line)}#map{height:45vh}#headline{font-size:19px}#overlay{max-width:calc(100% - 28px)}.legend,.mast{display:none}.author{top:10px;right:10px;padding:5px 9px;font-size:11px}.author span{font-size:9px}#card{min-width:0}}

.tabs{display:flex;gap:6px;align-items:stretch}
.tabs>button{flex:1;padding:10px 8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;font-weight:800;font-size:14px;cursor:pointer;line-height:1.15}
.tabs>button small{display:block;font-size:10px;font-weight:600;color:var(--mut);margin-top:2px}
.tabs>button:hover{border-color:var(--laranja)}
.tabs>button.on{background:var(--acc-bg);border-color:var(--acc-bg);color:#fff}
.tabs>button.on small{color:#fff}
.icos{display:flex;flex-direction:column;gap:4px}
.ico{width:34px;flex:1;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:6px;cursor:pointer;font-size:14px}
.ico:hover{border-color:var(--laranja)}
.crumbs{margin:14px 0 6px;font-size:12px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumbs a{color:var(--acc-txt);font-weight:700;text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.crumbs span{color:var(--ink);font-weight:700}
.crumbs i{font-style:normal;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:18px;font-weight:800;color:var(--ink);line-height:1.1}
.stats span{font-size:11px;color:var(--mut);margin-top:3px;line-height:1.3}
.lab{pointer-events:none}
.subv{margin-top:10px}
.ctitle{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--laranja);border-radius:6px;padding:7px 12px;box-shadow:0 4px 14px var(--shadow);color:var(--ink);font-size:13px}
.ctitle b{font-size:16px;font-weight:800;display:block;line-height:1.15}
.ctitle span{color:var(--mut);font-size:11px;font-weight:600}
.overrow{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.stats button{all:unset;box-sizing:border-box;display:flex;flex-direction:column;cursor:pointer;border-radius:6px;padding:5px 7px;margin:-6px 0;border:1px dashed var(--line)}
.stats button:hover{border-color:var(--laranja);border-style:solid}

.stats button.on{background:var(--hl);border:1px solid var(--laranja)}

.stats button b:after{content:" ›";color:var(--acc-txt)}
.stats button.on b:after{content:" ✓"}
.ctitle .x2{border:0;background:none;color:var(--mut);font-size:15px;cursor:pointer;padding:0 0 0 10px;float:right;line-height:1}

.tabs.so-icones>button{display:none}
.tabs.so-icones{justify-content:flex-end}
.tabs.so-icones .icos{flex-direction:row}
.tabs.so-icones .ico{height:32px}
.cmpbox{margin-top:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.cmpbox .t{font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;color:var(--ink);margin-bottom:6px}
.cmpbox .gl2{font-size:10px;color:var(--mut);margin-top:6px;line-height:1.4}
.cmp div{display:grid;grid-template-columns:104px 1fr 46px 40px;gap:6px;align-items:center;font-size:12px;padding:3px 4px;border-radius:4px}
.cmp .bar{height:7px;background:var(--soft);border-radius:4px;overflow:hidden}
.cmp .bar i{display:block;height:100%;background:var(--barmut);border-radius:4px}
.cmp b{text-align:right;color:var(--ink)}
.cmp em{font-style:normal;text-align:right;color:var(--mut);font-size:11px}
.cmp .me{font-weight:800;color:var(--ink)}
.cmp .me .bar i{background:var(--laranja)}
.cmp .me em{color:var(--text)}
.cmp.clic div{cursor:pointer}
.cmp.clic div:hover{background:var(--hl)}
.cmp.clic div:hover em{color:var(--text)}
#card .cmp{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
#card .cmp div{grid-template-columns:92px 1fr 40px 38px;font-size:11px;padding:2px 0}
.bl .dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}
.lab.grp{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 9px;text-shadow:none;box-shadow:0 3px 10px var(--shadow)}
.lab.grp b{color:var(--acc-txt)}
.legend .it{cursor:pointer;border-radius:4px;padding:0 4px;margin:0 -4px}
.legend .it:hover{background:var(--hl)}
</style></head>

const cor=()=>'rgb('+T.base.join(',')+')',op=t=>T.op0+(.96-T.op0)*t;
let ord=[];
function heat(x){const n=ord.length;if(!n||x<=0)return 0;let lo=0,hi=n;while(lo<hi){const m=(lo+hi)>>1;if(ord[m]<x)lo=m+1;else hi=m;}
  const pctl=n>1?lo/(n-1):1,mag=Math.sqrt(x/ord[n-1]);return Math.min(1,.7*pctl+.3*mag);}
function estilo(f){const p=f.properties,s={color:T.stroke,weight:p.isReg?1.6:.8,fillOpacity:.92};
  if(nivel==='drill')return p.nome===uni?{color:T.outline,weight:2.5,fillColor:T.cityBg,fillOpacity:1}:{...s,fillColor:T.faded,fillOpacity:.5};
  if(nivel==='top'&&!emFoco(p))return{...s,fillColor:T.faded,fillOpacity:.55};
  if(emDest()&&!p.isReg)return lider(p)?{color:T.outline,weight:2.2,fillColor:distView()?T.dist[p.reg]:cor(),fillOpacity:.96}:{...s,fillColor:T.faded,fillOpacity:.45};
  if(!p.v)return{...s,fillColor:T.zero};
  const c=(!CE&&nivel==='top'&&(vista==='dist'||reg))?T.dist[p.reg]:cor();
  return{...s,fillColor:c,fillOpacity:op(heat(val(p)))};}

const camU=L.geoJSON(UNID,{style:estilo,onEachFeature:(f,l)=>{byU[f.properties.nome]=l;
  l.on({mouseover:()=>{if(nivel==='drill'&&f.properties.nome===uni)return;hover(l);},mouseout:unhover,
    click:()=>{if(nivel==='drill'&&f.properties.nome===uni)return;if(emDest()&&!lider(f.properties)){sairDest();return;}clicaUni(f.properties.nome);}});}});
const camB=CE?L.geoJSON(BAIRROS,{style:estilo,onEachFeature:(f,l)=>{byB[f.properties.nome]=l;
  l.on({mouseover:()=>{if(nivel==='drill'&&f.properties.nome===uni)return;hover(l);},mouseout:unhover,
    click:()=>{if(nivel==='drill'&&f.properties.nome===uni)return;if(emDest()&&!lider(f.properties)){sairDest();return;}entrarBairroFor(f.properties.nome);}});}}):null;
// grupos (regiões/distritos) com contorno único
const topo=topojson.topology({c:UNID},1e5),byReg={};
const REGGEO={type:'FeatureCollection',features:REGS.map(r=>({type:'Feature',properties:{nome:r.nome,reg:r.nome,v:0,val:0,isReg:true},geometry:topojson.merge(topo,topo.objects.c.geometries.filter(g=>g.properties.reg===r.nome))}))};
const camReg=L.geoJSON(REGGEO,{style:estilo,onEachFeature:(f,l)=>{byReg[f.properties.nome]=l;
  l.on({mouseover:()=>{setOutline('rr'+f.properties.nome,[l]);showCard(cardRegiao(REG[f.properties.nome]),true);},mouseout:unhover,click:()=>entrarRegiao(f.properties.nome)});}});
const topoB=camU.getBounds(),forB=CE?camB.getBounds():null,regB={};
REGS.forEach(r=>{const b=L.latLngBounds([]);r.cid.forEach(n=>b.extend(byU[n].getBounds()));regB[r.nome]=b;});
const nomesU=UNID.features.map(f=>f.properties.nome),nomesB=CE?BAIRROS.features.map(f=>f.properties.nome):[];
$('nomes').innerHTML=[...nomesU,...nomesB.map(n=>n+' (Fortaleza)')].sort((a,b)=>a.localeCompare(b,'pt')).map(n=>`<option value="${esc(n)}">`).join('');
function fmtV(x){return metric==='v'?fmt(Math.round(x)):pct(x,1,x<.1?1:0);}
function regCentro(r){const c=REG[r].cid.map(n=>byU[n].getBounds()).reduce((s,b)=>{const a=(b.getNorth()-b.getSouth())*(b.getEast()-b.getWest()),k=b.getCenter();return[s[0]+k.lat*a,s[1]+k.lng*a,s[2]+a];},[0,0,0]);return[c[0]/c[2],c[1]/c[2]];}

// ---- dentro de uma cidade/bairro: locais de votação [nome,localidade,lat,lon,[votos x4],validosFed,validosEst,secoes] ----
const fonteLoc=()=>uniTipo==='b'?LOCAIS_FOR[uni]||[]:(LOCAIS[uni]||[]);
const locs=()=>uni?fonteLoc().map((a,i)=>({i,nome:a[0],bairro:a[1],lat:a[2],lon:a[3],vs:a[4],v:a[4][ci],val:M.cargo==='fed'?a[5]:a[6],valF:a[5],valE:a[6],sec:a[7]})):[];
// em cidades do interior agrupa por localidade (bairro/distrito do TSE); em bairro de Fortaleza cada local é um item
const agrupaPorLocal=()=>!CE||uniTipo==='b';
function bairrosCidade(){const g={};locs().forEach(l=>{const k=agrupaPorLocal()?l.nome+'#'+l.i:l.bairro;const b=g[k]||(g[k]={nome:agrupaPorLocal()?l.nome:l.bairro,v:0,val:0,n:0,loc:[]});b.v+=l.v;b.val+=l.val;b.n++;b.loc.push(l.i);});return Object.values(g);}

const cacheOut={};
function contorno(key,ls,c,peso){return cacheOut[key+c+peso]||(cacheOut[key+c+peso]=L.featureGroup(ls.map(x=>L.geoJSON(x.feature,{interactive:false,style:{color:c,weight:peso,fill:false}}))));}
function setOutline(key,ls){if(outline&&outline._k===key)return;clearOutline();outline=contorno(key,ls,T.outline,2.5);outline._k=key;outline.addTo(map);}
function clearOutline(){if(outline){map.removeLayer(outline);outline=null;}}
function drawSel(){if(selLine){map.removeLayer(selLine);selLine=null;}
  if(nivel==='drill'){desenhaPontos();return;}
  if(nivel==='top'&&reg)selLine=contorno('rg'+reg,[byReg[reg]],T.outline,2.5).addTo(map);}
// contorno dos distritos (só no mapa de Fortaleza)
function desenhaDistritos(){if(distLinhas){map.removeLayer(distLinhas);distLinhas=null;}
  if(!CE&&nivel==='top'&&(vista==='dist'||reg))distLinhas=L.geoJSON(REGGEO,{interactive:false,style:{color:T.outline,weight:2.4,fill:false,opacity:.9}}).addTo(map);}

const fecha=fixo=>fixo?'<button class="x" onclick="unpin()" title="Fechar">×</button>':'';
const badge=p=>p.pos===1?'<span class="badge">1º lugar</span>':'';
function cardUni(p,ehBairroCE){const d=!CE||ehBairroCE?'':'';
  return `<div class="k">${esc(p.nome)}${badge(p)}<small>${CE&&!ehBairroCE?esc(W.grpNome(p.reg)):(ehBairroCE?'Fortaleza':'Distrito '+esc(p.reg))}</small></div>
  <div class="big">${fmt(p.v)} <small>votos de ${esc(M.urna)}</small></div><div class="s">${pct(p.v,p.val)} dos válidos · ${p.pos?p.pos+'º lugar':'sem votos'}</div>
  <div class="hint">Clique para ver os locais de votação</div>`;}
function cardRegiao(r){const cs=r.cid.map(n=>byU[n].feature.properties).sort((a,b)=>b.v-a.v);
  return `<div class="k">${esc(W.grpNome(r.nome))}<small>${r.cid.length} ${W.unis}</small></div><div class="big">${fmt(r.v)} <small>votos</small></div><div class="s">${pct(r.v,r.val)} dos válidos · ${pct(r.v,M.total0())} do total</div><div class="row"><span>Mais forte em ${esc(cs[0].nome)}</span><b>${fmt(cs[0].v)}</b></div><div class="hint">Clique para ver ${CE?'as cidades':'os bairros'}</div>`;}
// comparativo dos 4 candidatos num lugar (cada um contra os válidos do próprio cargo)
function comparativo(vs,vF,vE){const mx=Math.max(1,...CANDS.map((c,i)=>vs[i]/((c.cargo==='fed'?vF:vE)||1)));
  return `<div class="cmp">${CANDS.map((c,i)=>{const va=c.cargo==='fed'?vF:vE,r=va?vs[i]/va:0;return `<div class="${i===ci?'me':''}"><span>${esc(c.urna)}</span><span class="bar"><i style="width:${r/mx*100}%"></i></span><b>${fmt(vs[i])}</b><em>${pct(vs[i],va)}</em></div>`;}).join('')}</div>`;}
function cardLocal(l,fixo){return `${fecha(fixo)}<div class="k">${esc(l.nome)}<small>${agrupaPorLocal()?'':esc(l.bairro)+' · '}${esc(uni)} · ${l.sec} seç${l.sec>1?'ões':'ão'}</small></div>
  <div class="big">${fmt(l.v)} <small>votos de ${esc(M.urna)}</small></div><div class="s">${pct(l.v,l.val)} dos válidos no local</div>${comparativo(l.vs,l.valF,l.valE)}`;}
function cardLocalidade(b,fixo){const L0=locs(),ls=b.loc.map(i=>L0[i]),vs=[0,1,2,3].map(i=>ls.reduce((s,l)=>s+l.vs[i],0));
  if(agrupaPorLocal())return cardLocal(ls[0],fixo);
  return `${fecha(fixo)}<div class="k">${esc(b.nome)}<small>${esc(uni)} · ${b.n} local${b.n>1?'is':''} de votação</small></div>
  <div class="big">${fmt(b.v)} <small>votos de ${esc(M.urna)}</small></div><div class="s">${pct(b.v,b.val)} dos válidos</div>
  ${comparativo(vs,ls.reduce((s,l)=>s+l.valF,0),ls.reduce((s,l)=>s+l.valE,0))}
  ${fixo?`<div class="sep">${ls.slice().sort((a,c)=>c.v-a.v).slice(0,4).map(l=>`<div class="row"><span>${esc(l.nome)}</span><b>${fmt(l.v)}</b></div>`).join('')}</div>`:''}`;}
function showCard(html,hov){const c=$('card');c.innerHTML=html;c.classList.toggle('hov',hov);c.hidden=false;}
function hover(l){const p=l.feature.properties;
  if(nivel==='top'&&reg&&p.reg!==reg){setOutline('rr'+p.reg,[byReg[p.reg]]);showCard(cardRegiao(REG[p.reg]).replace(/Clique para ver [^<]*/,`Clique para ir a ${CE?'esta região':'este distrito'}`),true);return;}
  setOutline('u'+p.nome+(l.feature.geometry===undefined),[l]);showCard(cardUni(p,CE&&nivel==='for'),true);}
function cardFixo(){if(!sel||nivel!=='drill')return null;
  if(sel.startsWith('L')){const l=locs()[+sel.slice(1)];return l?cardLocal(l,true):null;}
  const b=bairrosCidade().find(x=>'B'+x.nome===sel);return b?cardLocalidade(b,true):null;}
function unhover(){clearOutline();const h=cardFixo();if(h)showCard(h,false);else $('card').hidden=true;}

function clicaUni(n){if(CE&&n==='Fortaleza'){entrarFortaleza();return;}entrarUni(n,'u');}
function pin(s){sel=s;drawSel();drawLabels();unhover();renderSide();syncHash();}
function unpin(){sel=null;drawSel();drawLabels();unhover();renderSide();syncHash();}

// bolhas por localidade/local, juntando as que se encostam na tela (refeito a cada zoom)
let grupos=[];
function bolhas(){const L0=locs();return bairrosCidade().map(b=>{const ls=b.loc.map(i=>L0[i]).filter(l=>l.lat!==null);if(!ls.length)return null;
  const w=ls.reduce((s,l)=>s+(l.v||1),0);return{...b,lat:ls.reduce((s,l)=>s+l.lat*(l.v||1),0)/w,lon:ls.reduce((s,l)=>s+l.lon*(l.v||1),0)/w};}).filter(Boolean);}
function raio(v,mx){const pq=innerWidth<760;return v?(pq?4:6)+(pq?12:22)*Math.sqrt(v/mx):(pq?3:4);}
function agrupa(BS,mx){const g=[];BS.slice().sort((a,b)=>b.v-a.v).forEach(b=>{const p=map.latLngToContainerPoint([b.lat,b.lon]),r=raio(b.v,mx);
  const c=g.find(c=>Math.hypot(c.p.x-p.x,c.p.y-p.y)<(c.r+r)*.8);
  if(c){c.m.push(b);c.v+=b.v;c.val+=b.val;c.r=raio(c.v,mx);}else g.push({p,r,m:[b],nome:b.nome,v:b.v,val:b.val,lat:b.lat,lon:b.lon});});return g;}
function cardGrupo(g){const top=g.m.slice().sort((a,b)=>b.v-a.v);
  return `<div class="k">${esc(g.nome)} e mais ${g.m.length-1}<small>${esc(uni)} · ${g.m.length} ${agrupaPorLocal()?'locais':'localidades'} próximos</small></div>
  <div class="big">${fmt(g.v)} <small>votos</small></div><div class="s">${pct(g.v,g.val)} dos válidos</div>
  <div class="sep">${top.slice(0,6).map(b=>`<div class="row"><span>${esc(b.nome)}</span><b>${fmt(b.v)}</b></div>`).join('')}${top.length>6?`<div class="row"><span>e outros ${top.length-6}</span><b></b></div>`:''}</div>
  <div class="hint">Clique para aproximar e separar</div>`;}
function desenhaPontos(){if(pontos){map.removeLayer(pontos);pontos=null;}grupos=[];if(nivel!=='drill')return;
  const L0=locs(),pq=innerWidth<760,ms=[],porLocal=agrupaPorLocal();
  const selB=sel?(sel.startsWith('B')?sel.slice(1):sel.startsWith('L')&&!porLocal?L0[+sel.slice(1)].bairro:null):null;
  const BS=bolhas(),mxB=Math.max(1,...BS.map(b=>b.v));
  ord=BS.map(val).filter(x=>x>0).sort((a,b)=>a-b);
  grupos=agrupa(BS.filter(b=>porLocal||b.nome!==selB),mxB);
  grupos.forEach(g=>{const um=g.m.length===1,b=g.m[0],on=um&&porLocal&&sel==='L'+b.loc[0],fo=(selB&&!porLocal)?.22:(g.v?op(heat(val(um?b:g))):.9);
    const m=L.circleMarker([g.lat,g.lon],{radius:g.r,color:on?T.outline:T.stroke,weight:on?3.5:um?1:2,dashArray:um?null:'3 3',fillColor:g.v?cor():T.zero,fillOpacity:fo});
    m.on({mouseover:()=>{m.setStyle({weight:3,color:T.outline});showCard(um?cardLocalidade(b,false)+(porLocal?'':'<div class="hint">Clique para ver os locais de votação</div>'):cardGrupo(g),true);},
      mouseout:()=>{m.setStyle({weight:on?3.5:um?1:2,color:on?T.outline:T.stroke});unhover();},
      click:()=>{if(um){porLocal?pin('L'+b.loc[0]):focoLocalidade(b);return;}const bb=L.latLngBounds(g.m.map(x=>[x.lat,x.lon]));
        if(map.getZoom()>=16||bb.getNorthEast().equals(bb.getSouthWest())){const t=g.m.slice().sort((a,c)=>c.v-a.v)[0];porLocal?pin('L'+t.loc[0]):focoLocalidade(t);}else map.flyToBounds(bb.pad(.5),{duration:.5,maxZoom:17});}});ms.push(m);});
  if(selB&&!porLocal){const b=bairrosCidade().find(x=>x.nome===selB);if(b){const ls=b.loc.map(i=>L0[i]).filter(l=>l.lat!==null),mx=Math.max(1,...ls.map(l=>l.v));
    ls.sort((a,c)=>c.v-a.v).forEach(l=>{const on=sel==='L'+l.i,r=l.v?(pq?4:6)+(pq?9:14)*Math.sqrt(l.v/mx):3.5;
      const m=L.circleMarker([l.lat,l.lon],{radius:r,color:on?T.outline:T.stroke,weight:on?3.5:1.5,fillColor:l.v?cor():T.zero,fillOpacity:.92});
      m.on({mouseover:()=>{m.setStyle({weight:3,color:T.outline});showCard(cardLocal(l,false),true);},mouseout:()=>{m.setStyle({weight:on?3.5:1.5,color:on?T.outline:T.stroke});unhover();},click:()=>pin('L'+l.i)});ms.push(m);});}}
  pontos=L.featureGroup(ms).addTo(map);}

function drawLabels(){if(labels)map.removeLayer(labels);const mk=[],usados=[];
  // pula nomes que encostariam em outro já posto (reaparecem ao dar zoom)
  const lab=(ll,html,cls)=>{const p=map.latLngToContainerPoint(ll),t=html.replace(/<b>.*<\/b>/,'').replace(/<[^>]+>/g,''),w=Math.max(44,Math.min(190,t.length*7));p.w=w;
    if(usados.some(q=>Math.abs(q.x-p.x)<(q.w+w)/2+6&&Math.abs(q.y-p.y)<32))return null;usados.push(p);
    return L.marker(ll,{interactive:false,keyboard:false,icon:L.divIcon({className:'lw',iconSize:[0,0],html:`<div class="lab ${cls||''}">${html}</div>`})});};
  const nl=innerWidth<760?3:5;
  if(nivel==='drill'){grupos.filter(g=>g.v).sort((a,b)=>b.v-a.v).slice(0,nl+3).forEach(g=>mk.push(lab([g.lat,g.lon],`${esc(g.nome)}${g.m.length>1?' +'+(g.m.length-1):''}<b>${fmtV(g.m.length>1?val(g):val(g.m[0]))}</b>`)));}
  else if(emDest()){const src=nivel==='for'?BAIRROS:UNID,by=nivel==='for'?byB:byU;src.features.map(f=>f.properties).filter(p=>emFoco(p)&&lider(p)).sort((a,b)=>b.v-a.v).forEach(p=>mk.push(lab(by[p.nome].getBounds().getCenter(),`${p.pos===1?'★':p.pos+'º'} ${esc(p.nome)}<b>${fmt(p.v)} · ${pct(p.v,p.val,0)}</b>`)));}
  else if(regView()||(distView()&&!reg)){REGS.slice().sort((a,b)=>val(b)-val(a)).forEach(r=>mk.push(lab(regCentro(r.nome),`${esc(W.grpNome(r.nome))}<b>${fmtV(val(r))}</b>`,distView()?'grp':'')));}
  else{const src=nivel==='for'?BAIRROS:UNID,by=nivel==='for'?byB:byU;
    const fs=src.features.map(f=>f.properties).filter(emFoco).sort((a,b)=>val(b)-val(a)).slice(0,nivel==='top'&&!reg?nl+1:nl);
    fs.forEach(p=>mk.push(lab(by[p.nome].getBounds().getCenter(),`${esc(p.nome)}<b>${fmtV(val(p))}</b>`)));
    if(CE&&nivel==='top'&&(!reg||reg==='Grande Fortaleza')&&!fs.some(p=>p.nome==='Fortaleza')){const p=byU.Fortaleza.feature.properties;mk.push(lab(byU.Fortaleza.getBounds().getCenter(),`Fortaleza<b>${fmtV(val(p))}</b>`));}}
  labels=L.layerGroup(mk.filter(Boolean)).addTo(map);}
map.on('zoomend',()=>{if(nivel==='drill')desenhaPontos();drawLabels();});

function drawLegend(){if(legend)legend.remove();legend=L.control({position:'bottomright'});
  legend.onAdd=()=>{const d=L.DomUtil.create('div','legend');L.DomEvent.disableClickPropagation(d);
    if(emDest()){d.innerHTML=`<div class="t">Destaque</div><div><i style="background:${distView()?T.dist.III:cor()};outline:2px solid ${T.outline};outline-offset:-2px"></i>${kDest===1?'foi o 1º colocado':'ficou entre os '+kDest+' primeiros'}</div><div><i style="background:${T.faded}"></i>demais ${nivel==='for'?'bairros':W.unis}</div><div class="gl" style="margin-top:4px">Esc ou clique fora para sair</div>`;return d;}
    if(!CE&&nivel==='top'&&(vista==='dist'||reg)){d.innerHTML=`<div class="t">Distritos · cor mais forte = mais votos</div>`+REGS.slice().sort((a,b)=>['I','II','III','IV','V','VI'].indexOf(a.nome)-['I','II','III','IV','V','VI'].indexOf(b.nome)).map(r=>`<div class="it" onclick="entrarRegiao('${r.nome}')"><i style="background:linear-gradient(90deg,${T.dist[r.nome]}33,${T.dist[r.nome]})"></i>Distrito ${r.nome}</div>`).join('');return d;}
    const qual=nivel==='drill'?(agrupaPorLocal()?'local de votação':'bairro/localidade'):nivel==='for'?'bairro':regView()?'região':W.uni;
    let r=`<div class="t">${metric==='v'?'Votos':'% dos válidos'} por ${qual}</div><div><i style="background:${T.zero}"></i>sem votos</div>`;
    const st=[0,.25,.5,.75,1].map(t=>`rgba(${T.base.join(',')},${op(t).toFixed(2)}) ${t*100}%`).join(',');
    const q=f=>ord.length?ord[Math.min(ord.length-1,Math.floor(f*(ord.length-1)))]:0;
    r+=`<div class="grad" style="background:linear-gradient(90deg,${st})"></div><div class="gl"><span>menos</span><span>mais</span></div><div class="gl"><span>${fmtV(q(0))}</span><span>${fmtV(q(.5))}</span><span>${fmtV(q(1))}</span></div>`;
    if(nivel==='drill')r+=`<div class="gl" style="margin-top:4px">Tamanho do ponto = número de votos</div>`;
    d.innerHTML=r;return d;};
  legend.addTo(map);}

// ---- lateral ----
let itensL=[];
function lista(el,arr){const base=itensL.length;itensL.push(...arr);const mx=Math.max(1e-9,...arr.map(b=>val(b)));
  $(el).innerHTML=arr.map((b,k)=>`<li class="${b.on?'sel':''}" onmouseenter="itensL[${base+k}].hov&&itensL[${base+k}].hov()" onmouseleave="unhover()" onclick="itensL[${base+k}].go()"><span class="bn" title="${esc(b.nome)}">${b.dot?`<i class="dot" style="background:${b.dot}"></i>`:''}${esc(b.nome)}</span><span class="bar"><i style="width:${Math.round(val(b)/mx*100)}%;${b.dot?'background:'+b.dot:''}"></i></span><span class="bv">${fmtV(val(b))}</span><span class="bp">${metric==='v'?pct(b.v,b.val,b.val&&b.v/b.val<.1?1:0):fmt(b.v)}</span></li>`).join('');}
const stat=(n,l)=>`<div><b>${n}</b><span>${l}</span></div>`;
const statB=(n,l,fn,on,tit)=>`<button class="${on?'on':''}" onclick="${fn}" title="${tit||''}"><b>${n}</b><span>${l}</span></button>`;
const crumb=(txt,fn)=>fn?`<a href="#" onclick="${fn};return false">${esc(txt)}</a>`:`<span>${esc(txt)}</span>`;
M.total0=()=>M.total;CANDS.forEach(c=>c.total0=()=>CE?c.total:c.forTotal);
function chips(){$('chips').innerHTML=CANDS.map((c,i)=>`<button class="chip${i===ci?' on':''}" onclick="setCand(${i})">${esc(c.urna)}<small>${cargoTxt(c)}</small></button>`).join('');}
function boxComparativo(titulo,vs,vF,vE){$('cmpbox').innerHTML=`<div class="t">${titulo}</div>`+`<div class="cmp clic">${CANDS.map((c,i)=>{const va=c.cargo==='fed'?vF:vE;const mx=Math.max(1,...CANDS.map((d,j)=>vs[j]/(((d.cargo==='fed'?vF:vE))||1)));const r=va?vs[i]/va:0;
  return `<div class="${i===ci?'me':''}" onclick="setCand(${i})" title="Ver ${esc(c.urna)}"><span>${esc(c.urna)}</span><span class="bar"><i style="width:${r/mx*100}%"></i></span><b>${fmt(vs[i])}</b><em>${pct(vs[i],va)}</em></div>`;}).join('')}</div><div class="gl2">% = votos ÷ válidos do cargo de cada um (federal ou estadual)</div>`;}
function somaVs(fs){return[[0,1,2,3].map(i=>fs.reduce((s,p)=>s+p.vs[i],0)),fs.reduce((s,p)=>s+p.valF,0),fs.reduce((s,p)=>s+p.valE,0)];}

function renderSide(){itensL=[];chips();const U=UNID.features.map(f=>f.properties),tot=M.total0();
  $('tabs').classList.toggle('so-icones',!CE);
  $('tabCE').classList.toggle('on',nivel!=='for'&&!(nivel==='drill'&&uniTipo==='b'));$('tabFOR').classList.toggle('on',nivel==='for'||(nivel==='drill'&&uniTipo==='b'));
  $('back').hidden=!(nivel==='drill'||(nivel==='top'&&reg));
  $('subV').hidden=!(nivel==='top'&&!reg);$('v1').classList.toggle('on',vista===W.v1[0]);$('v2').classList.toggle('on',vista===W.v2[0]);
  $('tags').innerHTML=`<span class="tag" style="background:${partCor[PARTIDO[M.key]]||'#444'};color:${PARTIDO[M.key]==='PSB'?'#1D1D1D':'#fff'}">${PARTIDO[M.key]} · nº ${M.nr}</span><span class="tag ok">${cargoTxt(M)} · ${M.rank}º mais votado no CE</span>`;
  // etiqueta fixa no mapa
  const ct=$('ctitle');ct.classList.toggle('dest',emDest());
  if(emDest()){const src=nivel==='for'?BAIRROS:UNID,n=src.features.filter(f=>emFoco(f.properties)&&lider(f.properties)).length;
    ct.innerHTML=`<button class="x2" onclick="sairDest()" title="Sair do destaque">✕</button><b>★ ${kDest===1?'1º lugar':'Top '+kDest} em ${n} ${nivel==='for'||!CE?(n>1?'bairros':'bairro'):(n>1?'cidades':'cidade')}</b><span>${reg?esc(W.grpNome(reg))+' · ':''}clique fora ou Esc para sair</span>`;ct.hidden=false;}
  else if(nivel==='drill'){const p=(uniTipo==='b'?byB:byU)[uni].feature.properties;ct.innerHTML=`<b>${esc(uni)}</b><span>${fmt(p.v)} votos de ${esc(M.urna)} · ${pct(p.v,p.val)} dos válidos</span>`;ct.hidden=false;}
  else if(nivel==='top'&&reg){ct.innerHTML=`<b>${esc(W.grpNome(reg))}</b><span>${fmt(REG[reg].v)} votos · ${REG[reg].cid.length} ${W.unis}</span>`;ct.hidden=false;}
  else ct.hidden=true;
  $('t2').hidden=false;$('l2').innerHTML='';$('t2').textContent='';
  const itU=(p,b)=>({nome:p.nome,v:p.v,val:p.val,dot:(!CE&&!b)?T.dist[p.reg]:null,on:p.nome===uni,go:()=>b?entrarBairroFor(p.nome):clicaUni(p.nome),hov:()=>hover((b?byB:byU)[p.nome])});
  // ---- dentro de uma cidade / bairro ----
  if(nivel==='drill'){const by=uniTipo==='b'?byB:byU,p=by[uni].feature.properties,bs=bairrosCidade().sort((a,b)=>val(b)-val(a)),ls=locs().sort((a,b)=>val(b)-val(a));
    $('crumbs').innerHTML=(CE?crumb('Ceará','irTopo()')+'<i>›</i>'+(uniTipo==='b'?crumb('Fortaleza','entrarFortaleza()'):crumb(W.grpNome(p.reg),`entrarRegiao('${p.reg}')`)):crumb('Fortaleza','irTopo()')+'<i>›</i>'+crumb(W.grpNome(p.reg),`entrarRegiao('${p.reg}')`))+'<i>›</i>'+crumb(uni);
    $('headline').innerHTML=`Em <u>${esc(uni)}</u>, <em>${fmt(p.v)}</em> votos`;
    $('subline').textContent=p.v?(p.pos===1?`${M.urna} foi o mais votado ali para ${cargoTxt(M).toLowerCase()}.`:`Liderou ali: ${p.lid} (${fmt(p.lidv)}).`)+` ${ls.length} locais de votação.`:'Sem votos aqui.';
    $('kn').innerHTML=`${fmt(p.v)}<small>votos de ${esc(M.urna)}</small>`;$('kl').textContent=uniTipo==='b'||!CE?'Fortaleza · '+(uniTipo==='b'?'bairro':W.grpNome(p.reg)):W.grpNome(p.reg);
    $('stats').innerHTML=stat(p.pos?p.pos+'º':'—','lugar aqui')+stat(pct(p.v,p.val),'dos válidos')+stat(pct(p.v,tot),'do total dele(a)');
    boxComparativo(`Comparativo em ${esc(uni)}`,p.vs,p.valF,p.valE);
    const selB=sel&&sel.startsWith('B')?sel.slice(1):null;
    if(agrupaPorLocal()){$('t1').textContent=`Locais de votação · ${ls.length}`;lista('l1',ls.map(l=>({nome:l.nome,v:l.v,val:l.val,on:sel==='L'+l.i,go:()=>focoLocal(l),hov:()=>showCard(cardLocal(l,false),true)})));$('t2').hidden=true;return;}
    $('t1').textContent=`Bairros e localidades · ${bs.length} (clique para ver os locais)`;
    lista('l1',bs.map(b=>({nome:b.nome,v:b.v,val:b.val,on:b.nome===selB,go:()=>focoLocalidade(b),hov:()=>showCard(cardLocalidade(b,false),true)})));
    $('t2').textContent=`Locais de votação · ${ls.length}`;
    lista('l2',ls.map(l=>({nome:l.nome,v:l.v,val:l.val,on:sel==='L'+l.i,go:()=>focoLocal(l),hov:()=>showCard(cardLocal(l,false),true)})));return;}
  // ---- Fortaleza por bairro (mapa do Ceará) ----
  if(nivel==='for'){const fz=byU.Fortaleza.feature.properties,B=BAIRROS.features.map(f=>f.properties),bs=B.filter(p=>p.v).sort((a,b)=>val(b)-val(a)),lid=calcK(B);
    $('crumbs').innerHTML=crumb('Ceará','irTopo()')+'<i>›</i>'+crumb('Fortaleza');
    $('headline').innerHTML=`Em <u>Fortaleza</u>, <em>${fmt(fz.v)}</em> votos`;
    $('subline').textContent=`Bairro mais forte: ${bs[0].nome} (${fmt(bs[0].v)}). Clique num bairro para ver os locais de votação.`;
    $('kn').innerHTML=`${fmt(fz.v)}<small>votos na capital</small>`;$('kl').textContent=`${M.completo}`;
    $('stats').innerHTML=stat(fz.pos+'º','lugar na capital')+stat(pct(fz.v,fz.val),'dos válidos')+(lid.length?statB(lid.length,`bairro${lid.length>1?'s':''} ${kTxt()}`,'toggleDest()',dest,'Acender no mapa só esses bairros'):stat(0,'bairros no top 10'));
    boxComparativo('Comparativo em Fortaleza',fz.vs,fz.valF,fz.valE);
    if(dest){$('t1').textContent=`★ ${kTit()} · ${lid.length}`;lista('l1',lid.sort((a,b)=>a.pos-b.pos||b.v-a.v).map(p=>itU(p,true)));$('t2').hidden=true;return;}
    $('t1').textContent=`Bairros · ${metric==='v'?'votos':'% dos válidos'}`;lista('l1',bs.map(p=>itU(p,true)));$('t2').hidden=true;return;}
  // ---- visão geral (estado ou capital) ----
  const lidT=calcK(U.filter(emFoco));
  if(!reg){const best=U.slice().sort((a,b)=>b.v-a.v)[0],com=U.filter(p=>p.v).length,[vs,vF,vE]=somaVs(U);
    $('crumbs').innerHTML=crumb(CE?'Ceará':'Fortaleza');
    $('headline').innerHTML=`<em>${esc(M.urna)}</em> teve mais força em <u>${esc(best.nome)}</u>`;
    $('subline').textContent=`${fmt(best.v)} votos ali, ${pct(best.v,best.val)} dos válidos. ${CE?'Região':'Distrito'} mais forte: ${W.grpNome(REGS[0].nome)} (${pct(REGS[0].v,tot,0)} do total).`;
    $('kn').innerHTML=`${fmt(tot)}<small>votos ${W.lugar}</small>`;$('kl').textContent=`${M.completo} · ${cargoTxt(M)}${CE?'':' · '+M.forRank+'º na capital'}`;
    $('stats').innerHTML=(lidT.length?statB(lidT.length,`${lidT.length>1?W.unis:W.uni} ${kTxt()}`,'toggleDest()',dest,dest?'Clique para sair do destaque':'Acender no mapa só esses lugares'):stat(0,`${W.unis} no top 10`))
      +stat(`${com}/${W.total}`,`${W.unis} com voto`)+statB(pct(best.v,tot,0),`do total em ${best.nome}`,`clicaUni(nomesU[${nomesU.indexOf(best.nome)}])`,false,`Abrir ${best.nome}`);
    boxComparativo(CE?'Comparativo no Ceará':'Comparativo em Fortaleza',vs,vF,vE);
    $('t1').textContent=CE?'Regiões de planejamento · 14':'Distritos de Educação · 6';
    lista('l1',REGS.slice().sort((a,b)=>val(b)-val(a)).map(r=>({nome:W.grpNome(r.nome),v:r.v,val:r.val,dot:CE?null:T.dist[r.nome],go:()=>entrarRegiao(r.nome),hov:()=>{setOutline('rr'+r.nome,[byReg[r.nome]]);showCard(cardRegiao(r),true);}})));
    if(dest){$('t2').textContent=`★ ${kTit()} · ${lidT.length}`;lista('l2',lidT.sort((a,b)=>a.pos-b.pos||b.v-a.v).map(p=>itU(p)));return;}
    $('t2').textContent=`${CE?'Cidades':'Bairros'} · ${metric==='v'?'mais votos':'maior % dos válidos'}`;
    lista('l2',U.slice().sort((a,b)=>val(b)-val(a)).slice(0,20).map(p=>itU(p)));return;}
  const R=REG[reg],cs=U.filter(p=>p.reg===reg).sort((a,b)=>val(b)-val(a)),[vs,vF,vE]=somaVs(cs);
  $('crumbs').innerHTML=crumb(CE?'Ceará':'Fortaleza','irTopo()')+'<i>›</i>'+crumb(W.grpNome(reg));
  $('headline').innerHTML=`<u>${esc(W.grpNome(reg))}</u>: <em>${fmt(R.v)}</em> votos`;
  $('subline').textContent=`Mais forte em ${cs[0].nome} (${fmt(cs[0].v)}). Clique num${CE?'a cidade':' bairro'} para ver os locais de votação.`;
  $('kn').innerHTML=`${fmt(R.v)}<small>votos ${CE?'na região':'no distrito'}</small>`;$('kl').textContent=`${R.cid.length} ${W.unis}`;
  $('stats').innerHTML=stat(pct(R.v,tot,0),'do total dele(a)')+stat(pct(R.v,R.val),'dos válidos')+(lidT.length?statB(lidT.length,`${kTxt()}`,'toggleDest()',dest,'Acender no mapa só esses lugares'):stat(0,'no top 10'));
  boxComparativo(`Comparativo ${CE?'na região':'no distrito'}`,vs,vF,vE);
  if(dest){$('t1').textContent=`★ ${kTit()} · ${lidT.length}`;lista('l1',lidT.sort((a,b)=>a.pos-b.pos||b.v-a.v).map(p=>itU(p)));$('t2').hidden=true;return;}
  $('t1').textContent=`${CE?'Cidades da região':'Bairros do distrito'} · ${cs.length}`;lista('l1',cs.map(p=>itU(p)));$('t2').hidden=true;}

function focoLocalidade(b){sel='B'+b.nome;const ls=b.loc.map(i=>locs()[i]).filter(l=>l.lat!==null);
  if(ls.length){const bb=L.latLngBounds(ls.map(l=>[l.lat,l.lon]));map.flyToBounds(bb.pad(.6),{maxZoom:15,duration:.5});}
  drawSel();drawLabels();unhover();renderSide();syncHash();}
function focoLocal(l){sel='L'+l.i;if(l.lat!==null)map.flyTo([l.lat,l.lon],Math.max(map.getZoom(),15),{duration:.5});drawSel();unhover();renderSide();syncHash();}

function render(){
  const cam=nivel==='for'||(nivel==='drill'&&uniTipo==='b')?camB:regView()?camReg:camU;
  [camB,camReg,camU].forEach(c=>{if(c&&c!==cam&&map.hasLayer(c))map.removeLayer(c);});cam.addTo(map);
  const fs=(nivel==='for'?BAIRROS:UNID).features.map(f=>f.properties).filter(emFoco);
  if(nivel!=='drill')ord=(regView()?REGS:fs).map(val).filter(x=>x>0).sort((a,b)=>a-b);
  if(nivel==='for'||nivel==='top')calcK(fs);
  cam.setStyle(estilo);if(emDest()){const by=nivel==='for'?byB:byU;fs.forEach(p=>{if(lider(p))by[p.nome].bringToFront();});}
  desenhaDistritos();drawSel();desenhaPontos();drawLabels();drawLegend();renderSide();unhover();
  $('mV').classList.toggle('on',metric==='v');$('mP').classList.toggle('on',metric==='p');}
function uniBounds(n,tipo){const src=tipo==='b'?LOCAIS_FOR[n]:LOCAIS[n],b=L.latLngBounds([]);(src||[]).forEach(a=>{if(a[2]!==null)b.extend([a[2],a[3]]);});
  const pol=(tipo==='b'?byB:byU)[n].getBounds();if(!b.isValid())return pol;b.extend(pol);return b.pad(.05);}
function irTopo(){dest=false;nivel='top';reg=null;uni=null;sel=null;render();map.flyToBounds(topoB,{padding:[20,20],duration:.6});syncHash();}
function entrarRegiao(r){dest=false;nivel='top';reg=r;uni=null;sel=null;render();map.flyToBounds(regB[r],{padding:[40,40],duration:.6});syncHash();}
function entrarUni(n,tipo){dest=false;nivel='drill';uni=n;uniTipo=tipo||'u';reg=uniTipo==='b'?null:byU[n].feature.properties.reg;sel=null;render();map.flyToBounds(uniBounds(n,uniTipo),{padding:[30,30],duration:.6,maxZoom:15});syncHash();}
function entrarBairroFor(n){entrarUni(n,'b');}
function entrarFortaleza(){if(!CE){irTopo();return;}dest=false;nivel='for';uni=null;sel=null;reg=null;render();map.flyToBounds(forB,{padding:[30,30],duration:.6});syncHash();}
function voltar(){if(nivel==='drill'&&uniTipo==='b')entrarFortaleza();else if(nivel==='drill'&&reg)entrarRegiao(reg);else irTopo();}
function setMetric(m){metric=m;render();syncHash();}
function setVista(v){vista=v;if(v==='reg')dest=false;render();syncHash();}
function setCand(i){if(i===ci)return;aplicaCand(i);render();syncHash();}
$('v1').onclick=()=>setVista(W.v1[0]);$('v2').onclick=()=>setVista(W.v2[0]);$('v1').textContent=W.v1[1];$('v2').textContent=W.v2[1];
function toggleDest(){dest=!dest;if(dest&&CE&&nivel==='top'&&!reg)vista='cid';sel=null;render();
  const src=nivel==='for'?BAIRROS:UNID,by=nivel==='for'?byB:byU;
  if(dest){const b=L.latLngBounds([]);src.features.forEach(f=>{if(lider(f.properties)&&emFoco(f.properties))b.extend(by[f.properties.nome].getBounds());});if(b.isValid())map.flyToBounds(b.pad(.35),{duration:.6});}
  else map.flyToBounds(nivel==='for'?forB:reg?regB[reg]:topoB,{padding:[20,20],duration:.6});syncHash();}
function sairDest(){if(dest)toggleDest();}
map.on('click',e=>{if(!emDest())return;const t=e.originalEvent&&e.originalEvent.target;if(t&&t.classList&&t.classList.contains('leaflet-interactive'))return;sairDest();});
$('side').addEventListener('click',e=>{if(emDest()&&!e.target.closest('button,a,li,input'))sairDest();});

function syncHash(){const h=new URLSearchParams();if(ci)h.set('k',ci);if(metric==='p')h.set('m','p');
  if(nivel==='top'&&!reg&&vista!==W.v1[0])h.set('v',vista);if(emDest())h.set('d','1');
  if(nivel==='drill'){h.set(uniTipo==='b'?'b':'u',uni);}else if(nivel==='for')h.set('f','1');else if(reg)h.set('r',reg);
  if(sel)h.set('s',sel);history.replaceState(null,'',h.toString()?'#'+h.toString():location.pathname+location.search);}
function share(){const b=$('share');(navigator.clipboard?navigator.clipboard.writeText(location.href):Promise.reject()).then(()=>{b.textContent='✓';},()=>{prompt('Copie o link:',location.href);}).finally(()=>setTimeout(()=>b.textContent='🔗',1800));}
$('q').placeholder=W.busca;
$('q').addEventListener('change',e=>{const v=e.target.value.trim().toLowerCase();let n;
  if(CE&&v.endsWith(' (fortaleza)')){n=nomesB.find(x=>(x+' (fortaleza)').toLowerCase()===v);if(n)entrarBairroFor(n);}
  else{n=nomesU.find(x=>x.toLowerCase()===v);if(n)clicaUni(n);else if(CE){n=nomesB.find(x=>x.toLowerCase()===v);if(n)entrarBairroFor(n);}}
  if(n){e.target.value='';e.target.blur();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(emDest())sairDest();else if(sel)unpin();else if(nivel!=='top'||reg)voltar();}});
$('mastT').textContent=W.titulo;$('mastS').textContent=CE?'Eleições 2026 · 1º turno · 184 cidades':'Eleições 2026 · 1º turno · bairros e Distritos de Educação';
$('foot').innerHTML=`Fonte: TSE, votação por seção e locais de votação, Eleições 2026, 1º turno (dados abertos). % dos válidos = votos do candidato ÷ votos válidos (nominais + legenda) do cargo dele: Idilvan e Larissa concorreram a Dep. Federal; Adriana e Eliana, a Dep. Estadual. Posição = colocação entre todos os candidatos do mesmo cargo naquele lugar. ${CE?'Regiões: 14 regiões de planejamento do Ceará (Lei Complementar estadual nº 154/2015). Localidades das cidades conforme o cadastro de locais de votação do TSE. ':''}Bairros de Fortaleza pelo endereço de cada local de votação no TSE, agrupados nos 6 Distritos de Educação.`;

(function init(){const h=new URLSearchParams(location.hash.slice(1));
  const k=+h.get('k');aplicaCand(k>=0&&k<4?k:0);
  if(h.get('m')==='p')metric='p';if(h.get('v')&&[W.v1[0],W.v2[0]].includes(h.get('v')))vista=h.get('v');if(h.get('d')==='1')dest=true;const s=h.get('s');
  if(h.get('u')&&byU[h.get('u')]&&!(CE&&h.get('u')==='Fortaleza')){nivel='drill';uni=h.get('u');uniTipo='u';reg=byU[uni].feature.properties.reg;dest=false;if(s)sel=s;}
  else if(CE&&h.get('b')&&byB[h.get('b')]){nivel='drill';uni=h.get('b');uniTipo='b';dest=false;if(s)sel=s;}
  else if(CE&&h.get('f')==='1'){nivel='for';}
  else if(REG[h.get('r')])reg=h.get('r');
  const alvo=()=>nivel==='drill'?uniBounds(uni,uniTipo):nivel==='for'?forB:reg?regB[reg]:topoB;
  let ok=false;if(map.getSize().x>0){try{map.fitBounds(alvo(),{padding:[20,20],maxZoom:15});ok=true;}catch(e){}}
  if(!ok){map.setView(CE?[-5.2,-39.5]:[-3.79,-38.53],CE?7:11);const ro=new ResizeObserver(()=>{if($('map').clientWidth>0){ro.disconnect();map.invalidateSize();map.fitBounds(alvo(),{padding:[20,20],maxZoom:15});drawLabels();}});ro.observe($('map'));}
  render();})();
</script></body></html>
